name: Update flatpak crate sources

on:
    schedule:
        - cron: "0 6 * * 1/2"
    workflow_dispatch:

jobs:
    update:
        permissions:
            contents: write
            pull-requests: write
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6
            
            - name: Install Uv
              uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e

            - name: Generate update sources
              run: |
                 curl https://raw.githubusercontent.com/elysiae-project/elysiae/refs/heads/main/Cargo.lock > elysiae-cargo.lock
                 curl -s https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/refs/heads/master/cargo/flatpak-cargo-generator.py | uv run --with tomlkit - -o ./flatpak/cargo-sources.json elysiae-cargo.lock

            - name: Commit and push changes
              run: |
                git config --global user.name 'github-actions[bot]'
                git config --global user.email 'github-actions[bot]@users.noreply.github.com'
                git add ./flatpak/cargo-sources.json
                git diff-index --quiet HEAD || git commit -m "chore: update flatpak cargo sources"
                git push origin HEAD:main
